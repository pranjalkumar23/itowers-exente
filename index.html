              "Summer Swim Camp":              "images/pool.jpg"
            };

            function replaceImages() {
              document.querySelectorAll('img').forEach(function (img) {
                var replacement = IMAGE_MAP[img.alt];
                if (replacement && img.src.indexOf('/images/') === -1) {
                  img.src = replacement;
                }
              });
            }

            var interval = setInterval(function () {
              replaceImages();
            }, 200);

            // Stop polling after 10s — MutationObserver takes over
            setTimeout(function () {
              clearInterval(interval);
              var observer = new MutationObserver(replaceImages);
              observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
            }, 10000);
          })();

        <script>
          (function () {
            var injected = null;

            function injectLogo() {
              var link = document.querySelector('[data-testid="nav-logo"]');
              if (!link) return false;
              if (link === injected) return true;
              injected = link;

              link.innerHTML = '';
              var img = document.createElement('img');
              img.src = 'black_logo.png';
              img.alt = 'iTowers Exente';
              img.className = 'nav-logo-img';
              link.appendChild(img);
              return true;
            }

            /* poll until injected, then watch for React re-mounts */
            var interval = setInterval(function () {
              if (injectLogo()) {
                clearInterval(interval);
                var observer = new MutationObserver(function () {
                  var link = document.querySelector('[data-testid="nav-logo"]');
                  if (link && link !== injected) injectLogo();
                });
                observer.observe(document.body, { childList: true, subtree: true });
              }
            }, 50);
          })();

          /* ── Internal Details section injected into /residents ── */
          (function () {
            var SECTION_ID = 'internal-details-section';

            var HTML = '<div id="' + SECTION_ID + '">' +
              '<p class="id-eyebrow">INTERNAL DETAILS</p>' +
              '<h2>Society Information Hub</h2>' +
              '<p class="id-subtitle">Access SOPs, financial reports and important updates — for residents only.</p>' +
              '<div class="id-grid">' +

              '<div class="id-card">' +
                '<div class="id-card-icon">📋</div>' +
                '<div class="id-card-title">SOPs & Guidelines</div>' +
                '<div class="id-card-desc">Standard operating procedures for maintenance, security, visitor management and common area usage.</div>' +
                '<a class="id-btn outline" href="/sops/move-in-move-out.html">Move-In / Move-Out SOP →</a>' +
              '</div>' +

              '<div class="id-card">' +
                '<div class="id-card-icon">💰</div>' +
                '<div class="id-card-title">Financials</div>' +
                '<div class="id-card-desc">Monthly and annual financial statements, maintenance collection status, and expense breakdowns.</div>' +
                '<a class="id-btn" href="https://iaoa-expense.netlify.app/" target="_blank" rel="noopener">Open Financials ↗</a>' +
              '</div>' +

              '<div class="id-card">' +
                '<div class="id-card-icon">📢</div>' +
                '<div class="id-card-title">Updates & Notices</div>' +
                '<div class="id-card-desc">Latest circulars, AGM minutes, committee decisions and important announcements from the management.</div>' +
                '<a class="id-btn outline" href="#notices">View Notices →</a>' +
              '</div>' +

              '</div>' +
              '<hr class="id-divider">' +
            '</div>';

            function isResidentsPage() {
              return window.location.pathname === '/residents' ||
                     window.location.pathname.startsWith('/residents/') ||
                     window.location.hash === '#/residents' ||
                     window.location.hash.startsWith('#/residents/');
            }

            function injectSection() {
              if (!isResidentsPage()) return;
              if (document.getElementById(SECTION_ID)) return;

              /* Find the checklist section to insert after it */
              var checklistHeading = Array.from(document.querySelectorAll('h2, h3')).find(function (h) {
                return h.textContent.includes('first-week checklist');
              });
              if (!checklistHeading) return;
              var checklistSection = checklistHeading.closest('section') || checklistHeading.parentElement;
              var residentsDiv = checklistSection.parentElement;
              if (!residentsDiv) return;

              var wrapper = document.createElement('div');
              wrapper.innerHTML = HTML;
              var node = wrapper.firstElementChild;
              /* insertBefore(node, null) appends — so this works whether there's a next sibling or not */
              residentsDiv.insertBefore(node, checklistSection.nextSibling);
            }

            /* Poll every 300ms — MutationObserver doesn't fire since React caches rendered content */
            setInterval(function () {
              if (isResidentsPage() && !document.getElementById(SECTION_ID)) {
                injectSection();
              }
            }, 300);
          })();
        </script>

              ['Mon — Sat \xb7 9:30 AM — 6:00 PM', 'iaoa@itowersexente.com'],
              /* Email update */

              ['Need a hand?', 'Need Help?'],

            /* Li text to remove entirely */
            var REMOVE_SENTENCES = [
              'The management team is at the clubhouse, Mon',
            ];

            var REMOVE_LI = [
              'Pay your one-time clubhouse activation',
              'Pick up your welcome kit',
              'Schedule water, gas and electricity meter readings',
              'Quiet hours: 10:00 PM',
              'Six shared EV chargers',
              'Booking via management WhatsApp group',
              'Personal EV points permitted',
            ];

            /* Card/section titles to remove entirely */
            var REMOVE_CARD_TITLE = ['EV Charging', 'Sports & Amenities', 'Deepa Krishnan'];

            function patchTextNodes() {
              var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
              var node;
              while ((node = walker.nextNode())) {
                var t = node.textContent;
                for (var i = 0; i < TEXT_MAP.length; i++) {
                  if (t.indexOf(TEXT_MAP[i][0]) !== -1) {
                    node.textContent = t.replace(TEXT_MAP[i][0], TEXT_MAP[i][1]);
                    t = node.textContent;
                  }
                }
              }
            }

            function removePhone() {
              document.querySelectorAll('a, span, p, div').forEach(function (el) {
                if (el.children.length === 0 && el.textContent.trim() === '+91 80 0000 0000') {
                  var parent = el.parentElement;
                  if (parent && parent.children.length <= 3) parent.remove();
                  else el.remove();
                }
              });
              document.querySelectorAll('a[href^="tel:"]').forEach(function (a) {
                var parent = a.parentElement;
                if (parent && parent.children.length <= 3) parent.remove();
                else a.remove();
              });
            }

            function removeWhatsApp() {
              var wp = document.querySelector('[data-testid="contact-whatsapp"]');
              if (wp) {
                var parent = wp.parentElement;
                if (parent && parent.children.length <= 2) parent.remove();
                else wp.remove();
              }
              document.querySelectorAll('a[href*="wa.me"]').forEach(function (a) {
                var parent = a.parentElement;
                if (parent && parent.children.length <= 2) parent.remove();
                else a.remove();
              });
            }

            function patchEmailHrefs() {
              document.querySelectorAll('a[href*="hello@itowersexente"]').forEach(function (a) {
                a.href = 'mailto:iaoa@itowersexente.com';
              });
            }

            function patchPolicyLinks() {
              var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
              var node;
              while ((node = walker.nextNode())) {
                if (node.textContent.trim() === 'Move-in / Move-out') {
                  var card = node.parentElement;
                  /* Walk up to the card container */
                  while (card && card.parentElement && card.parentElement.children.length < 2) {
                    card = card.parentElement;
                  }
                  if (card && !card.dataset.sopPatched) {
                    card.dataset.sopPatched = '1';
                    card.style.cssText += 'cursor:pointer;transition:box-shadow 0.2s,transform 0.2s;';
                    card.addEventListener('mouseenter', function() {
                      this.style.boxShadow = '0 4px 20px rgba(26,54,34,0.15)';
                      this.style.transform = 'translateY(-2px)';
                    });
                    card.addEventListener('mouseleave', function() {
                      this.style.boxShadow = '';
                      this.style.transform = '';
                    });
                    card.addEventListener('click', function(e) {
                      if (!e.target.closest('a')) {
                        window.location.href = '/sops/move-in-move-out.html';
                      }
                    });
                  }
                  break;
                }
              }
            }

            function hideLibraryBorrowingDetails() {
              if (!window.location.pathname.startsWith('/library')) return;
              var texts = ['Borrow: Up to 3 books', 'Late returns:', 'Open daily, 9:00 AM'];
              document.querySelectorAll('li').forEach(function(li) {
                if (texts.some(function(t) { return li.textContent.includes(t); })) {
                  li.style.setProperty('display', 'none', 'important');
                }
              });
            }
            setInterval(hideLibraryBorrowingDetails, 300);

            function hideEmptyPolicyCard() {
              var card = document.querySelector('[data-testid="policy-card-5"]');
              if (card) card.style.setProperty('display', 'none', 'important');
            }
            setInterval(hideEmptyPolicyCard, 300);

            function hideCommunityCorner() {
              var section = document.querySelector('[data-testid="events-section"]');
              if (section) section.style.setProperty('display', 'none', 'important');
            }
            setInterval(hideCommunityCorner, 300);

            function removeCommitteeSection() {
              /* Target the first committee card; its grandparent is the section container */
              var card = document.querySelector('[data-testid="committee-0"]');
              if (!card) return;
              /* card → grid → section wrapper */
              var section = card.parentElement && card.parentElement.parentElement;
              if (section) {
                section.style.setProperty('display', 'none', 'important');
              }
            }

            function removeSentences() {
              var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
              var node;
              var toRemove = [];
              while ((node = walker.nextNode())) {
                for (var i = 0; i < REMOVE_SENTENCES.length; i++) {
                  if (node.textContent.indexOf(REMOVE_SENTENCES[i]) !== -1) {
                    toRemove.push(node.parentElement);
                    break;
                  }
                }
              }
              toRemove.forEach(function(el) { if (el && el.parentElement) el.parentElement.removeChild(el); });
            }

            function patchContactForm() {
              var form = document.querySelector('[data-testid="contact-form"]');
              if (!form || form._mailtoPatched) return;
              form._mailtoPatched = true;
              form.addEventListener('submit', function (e) {
                e.preventDefault();
                e.stopImmediatePropagation();
                var name    = (form.querySelector('input[type="text"]')  || {}).value || '';
                var email   = (form.querySelector('input[type="email"]') || {}).value || '';
                var subject = '';
                form.querySelectorAll('input[type="text"]').forEach(function (inp, i) {
                  if (i === 1) subject = inp.value;
                });
                var message = (form.querySelector('textarea') || {}).value || '';
                var body = (name ? 'From: ' + name + ' (' + email + ')\n\n' : '') + message;
                window.location.href = 'mailto:iaoa@itowersexente.com'
                  + '?subject=' + encodeURIComponent(subject || 'Website Enquiry')
                  + '&body='    + encodeURIComponent(body);
              }, true);
            }

            function removeLiItems() {
              document.querySelectorAll('li').forEach(function (li) {
                var t = li.textContent;
                for (var i = 0; i < REMOVE_LI.length; i++) {
                  if (t.indexOf(REMOVE_LI[i]) !== -1) { li.remove(); return; }
                }
              });
            }

            function removeCards() {
              REMOVE_CARD_TITLE.forEach(function (title) {
                /* Find a text node whose trimmed content exactly matches the title */
                var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                var node;
                while ((node = walker.nextNode())) {
                  if (node.textContent.trim() === title) {
                    /* Walk up to find a removable card — first ancestor that has siblings */
                    var el = node.parentElement;
                    while (el && el.parentElement && el.parentElement.children.length < 2) {
                      el = el.parentElement;
                    }
                    if (el) el.remove();
                    break;
                  }
                }
              });
            }

            function patchNavLocation() {
              /* Remove Residents link from nav */
              var resNav = document.querySelector('[data-testid="nav-link-residents"]');
              if (resNav && !resNav.dataset.hiddenByPatch) {
                resNav.dataset.hiddenByPatch = '1';
                resNav.style.display = 'none';
              }

              /* Top-right button → Residents */
              var btn = document.querySelector('[data-testid="nav-visitor-pass-btn"]');
              if (btn && !btn.dataset.residentPatched) {
                btn.dataset.residentPatched = '1';
                btn.href = '/residents';
                btn.removeAttribute('target');
                btn.removeAttribute('rel');
                btn.textContent = 'Residents';
                btn.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  window.history.pushState({}, '', '/residents');
                  window.dispatchEvent(new PopStateEvent('popstate'));
                }, true);
              }

              /* Mobile menu: hide Residents link, change CTA button to Residents */
              document.querySelectorAll('a[href="/residents"]').forEach(function(el) {
                /* Mobile menu nav link (plain text "Residents") */
                if (el.dataset.testid === 'nav-link-residents' || (el.textContent.trim() === 'Residents' && !el.dataset.residentPatched && el !== btn)) {
                  el.dataset.hiddenByPatch = '1';
                  el.style.display = 'none';
                }
              });
              /* Mobile CTA only — identified by its rounded-full forest background style in the mobile menu */
              document.querySelectorAll('a[href="/visitors"], a[href="https://maps.app.goo.gl/xyd9uxx1kbVx7zqr5"]').forEach(function(el) {
                if (!el.dataset.residentPatched && el !== btn && el.className.indexOf('rounded-full') !== -1 && el.className.indexOf('bg-brand-forest') !== -1) {
                  el.dataset.residentPatched = '1';
                  el.href = '/residents';
                  el.removeAttribute('target');
                  el.removeAttribute('rel');
                  el.textContent = 'Residents';
                  el.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    window.history.pushState({}, '', '/residents');
                    window.dispatchEvent(new PopStateEvent('popstate'));
                  }, true);
                }
              });
            }

            var EXTRA_VENDOR = { name: 'Crèche',  category: 'Childcare · In-society', tag: 'Safe & nurturing environment', img: 'https://images.pexels.com/photos/1001914/pexels-photo-1001914.jpeg?auto=compress&cs=tinysrgb&w=400' };

            var VENDORS = [
              { name: 'Riri Mart',              category: 'Supermarket',          tag: 'Near Clubhouse entry',         img: 'images/clubhouse.jpg' },
              { name: 'Immanuvel Cleaners',     category: 'Laundry & Dry Clean',  tag: 'Pickup & delivery available',  img: 'https://images.pexels.com/photos/37100665/pexels-photo-37100665.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Gym Personal Trainers',  category: 'Fitness · In-society', tag: 'One-on-one sessions',          img: 'images/gym.jpg' },
              { name: 'Squash Trainers',        category: 'Sports · In-society',  tag: 'Group & individual coaching',  img: 'images/tennis.jpg' },
              { name: 'Music Classes',          category: 'Classes · In-society', tag: 'All instruments & vocals',     img: 'https://images.pexels.com/photos/4088009/pexels-photo-4088009.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Dance Classes',          category: 'Classes · In-society', tag: 'Bollywood, classical & more',  img: 'https://images.pexels.com/photos/3662845/pexels-photo-3662845.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Yoga Classes',           category: 'Wellness · In-society', tag: 'Morning & evening batches',   img: 'https://images.pexels.com/photos/3822906/pexels-photo-3822906.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Football',               category: 'Sports · In-society',  tag: 'Weekend matches & coaching',   img: 'https://images.pexels.com/photos/47730/the-ball-stadion-football-the-pitch-47730.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Basketball',             category: 'Sports · In-society',  tag: 'Open court & coaching',        img: 'images/basketball.jpg' },
              { name: 'Tennis',                 category: 'Sports · In-society',  tag: 'Court bookings via FM',        img: 'images/tennis.jpg' },
              { name: 'Skating',                category: 'Sports · In-society',  tag: 'Kids & adults welcome',        img: 'https://images.pexels.com/photos/32317097/pexels-photo-32317097.jpeg?auto=compress&cs=tinysrgb&w=400' },
              { name: 'Cricket',                category: 'Sports · In-society',  tag: 'Practice nets available',      img: 'https://images.pexels.com/photos/13509805/pexels-photo-13509805.jpeg?auto=compress&cs=tinysrgb&w=400' },
            ];

            function patchVendorCards() {
              VENDORS.forEach(function(v, i) {
                document.querySelectorAll('[data-testid="vendor-card-' + i + '"]').forEach(function(card) {
                  if (card.dataset.vendorPatched === v.name) return;
                  card.dataset.vendorPatched = v.name;
                  var img = card.querySelector('img');
                  if (img) { img.src = v.img; img.alt = v.name; }
                  var cat = card.querySelector('div.text-\\[11px\\]') || card.querySelector('[class*="uppercase"][class*="tracking"]');
                  if (cat) cat.textContent = v.category;
                  var h3 = card.querySelector('h3');
                  if (h3) h3.textContent = v.name;
                  var offer = card.querySelector('span.text-sm');
                  if (offer) offer.textContent = v.tag;
                });
              });
              /* Inject Crèche only into the source band — the clone picks it up via the loop */
              document.querySelectorAll('.rfm-initial-child-container').forEach(function(band) {
                if (false) return; /* placeholder */
                if (band.querySelector('[data-creche]')) return;
                var template = band.querySelector('article[data-testid^="vendor-card-"]');
                if (!template) return;
                var clone = template.cloneNode(true);
                delete clone.dataset.testid;
                clone.dataset.creche = '1';
                var img = clone.querySelector('img'); if (img) { img.src = EXTRA_VENDOR.img; img.alt = EXTRA_VENDOR.name; }
                var cat = clone.querySelector('[class*="uppercase"][class*="tracking"]'); if (cat) cat.textContent = EXTRA_VENDOR.category;
                var h3 = clone.querySelector('h3'); if (h3) h3.textContent = EXTRA_VENDOR.name;
                var offer = clone.querySelector('span.text-sm'); if (offer) offer.textContent = EXTRA_VENDOR.tag;
                band.appendChild(clone);
              });
            }

            /* ── Sponsor data — edit this array to add/remove sponsors ── */
            var SPONSORS = [
              /* Example — replace with real sponsors:
              {
                name: 'Brand Name',
                tagline: 'Short offer description for residents',
                cta: 'View Offer',
                url: 'https://brandwebsite.com',
                img: 'https://image-url.com/photo.jpg'
              },
              */
            ];

            function injectSponsorsSection() {
              if (window.location.pathname !== '/' && window.location.pathname !== '') return;
              if (document.getElementById('sponsors-section')) return;
              var marquee = document.querySelector('[data-testid="vendor-marquee-section"]');
              if (!marquee) return;

              var sponsorCards = '';
              if (SPONSORS.length > 0) {
                SPONSORS.forEach(function(s) {
                  var imgHtml = s.img
                    ? '<img src="' + s.img + '" alt="' + s.name + '" />'
                    : '<div class="sp-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>LOGO</div>';
                  sponsorCards +=
                    '<a class="sp-card" href="' + s.url + '" target="_blank" rel="noopener">' +
                      '<div class="sp-card-img">' + imgHtml + '<span class="sp-badge">Sponsored</span></div>' +
                      '<div class="sp-card-body">' +
                        '<div class="sp-card-name">' + s.name + '</div>' +
                        '<div class="sp-card-tagline">' + s.tagline + '</div>' +
                        '<div class="sp-card-cta">' + (s.cta || 'View Offer') + ' →</div>' +
                      '</div>' +
                    '</a>';
                });
              }

              /* Always show 3 "Your brand here" slots if fewer than 3 real sponsors */
              var emptySlots = Math.max(0, 3 - SPONSORS.length);
              for (var i = 0; i < emptySlots; i++) {
                sponsorCards +=
                  '<div class="sp-empty">' +
                    '<div class="sp-empty-icon">📣</div>' +
                    '<strong>Your brand here</strong>' +
                    '<span>Reach 438+ Exente families with<br>an exclusive residents-only offer.</span>' +
                  '</div>';
              }

              var section = document.createElement('section');
              section.id = 'sponsors-section';
              section.innerHTML =
                '<div class="sp-inner">' +
                  '<div class="sp-header">' +
                    '<div>' +
                      '<p class="sp-eyebrow">SPONSORSHIPS</p>' +
                      '<h2 class="sp-heading">Put Your Brand in Front of Hundreds of Daily Visitors</h2>' +
                    '</div>' +
                    '<a class="sp-advertise" href="mailto:iaoa@itowersexente.com?subject=Advertise%20on%20iTowers%20Exente%20Portal&body=Hi%2C%20I%27d%20like%20to%20know%20more%20about%20advertising%20on%20the%20iTowers%20Exente%20community%20portal.">Advertise here →</a>' +
                  '</div>' +
                  '<div class="sp-grid">' + sponsorCards + '</div>' +
                  '<p class="sp-footer">Interested in reaching Exente residents? <a href="mailto:iaoa@itowersexente.com?subject=Advertise%20on%20iTowers%20Exente%20Portal">Email us</a> to get featured.</p>' +
                '</div>';

              marquee.insertAdjacentElement('afterend', section);
            }

            setInterval(injectSponsorsSection, 300);

            function patchAmenitiesCreche() {
              var path = window.location.pathname;
              if (path !== '/' && path !== '' && !path.startsWith('/amenities')) return;
              if (document.querySelector('[data-creche-amenity]')) return;
              /* Find the grid that actually holds amenity cards */
              var firstCard = document.querySelector('[data-testid="amenity-card-0"]');
              if (!firstCard) return;
              var grid = firstCard.parentElement;
              if (!grid) return;
              var card = document.createElement('article');
              card.setAttribute('data-creche-amenity', '1');
              card.className = 'relative group overflow-hidden rounded-2xl border border-brand-sage bg-brand-sage/30';
              card.style.cssText = 'grid-column: 1 / -1; min-height: 260px;';
              card.innerHTML =
                '<img src="https://images.pexels.com/photos/1001914/pexels-photo-1001914.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Crèche" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />' +
                '<div class="absolute inset-0" style="background:linear-gradient(to top,rgba(26,54,34,0.9),rgba(26,54,34,0.3),transparent)"></div>' +
                '<div class="relative h-full flex flex-col justify-end p-6 md:p-8">' +
                  '<h3 class="font-display text-2xl md:text-3xl" style="color:#FAF8F4">Crèche</h3>' +
                  '<p class="text-sm mt-2 max-w-md leading-relaxed" style="color:rgba(250,248,244,0.85)">Safe, nurturing childcare within the community</p>' +
                '</div>';
              grid.appendChild(card);
            }

            setInterval(patchAmenitiesCreche, 300);
            /* Dedicated interval: hides committee section whenever React re-renders it */
            setInterval(removeCommitteeSection, 300);

            var patching = false;
            var timer = null;

            function schedule() {
              if (timer) clearTimeout(timer);
              timer = setTimeout(function () {
                if (patching) return;
                patching = true;
                patchTextNodes();
                removePhone();
                removeWhatsApp();
                patchEmailHrefs();
                removeLiItems();
                removeCards();
                patchPolicyLinks();
                patchContactForm();
                removeSentences();
                removeCommitteeSection();
                injectSponsorsSection();
                patchAmenitiesCreche();
                patchVendorCards();
                patchNavLocation();
                patching = false;
              }, 120);
            }

            var observer = new MutationObserver(function () {
              if (!patching) schedule();
            });

            /* document.body is null while <head> scripts run — defer until DOM ready */
            document.addEventListener('DOMContentLoaded', function () {
              observer.observe(document.body, { childList: true, subtree: true });
              setTimeout(schedule, 400);
            });
            /* Re-run after React Router navigates (pushState doesn't fire popstate) */
            (function() {
              var orig = history.pushState.bind(history);
              history.pushState = function() {
                orig.apply(history, arguments);
                setTimeout(schedule, 300);
                setTimeout(schedule, 700);
              };
            })();
            window.addEventListener('popstate', function() { setTimeout(schedule, 300); });
          })();
        </script>
